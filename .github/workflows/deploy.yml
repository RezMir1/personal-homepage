
name: Deploy Personal Homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate files
        run: |
          test -s index.html
          python3 -m json.tool projects.json > /dev/null

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST" || exit 1
          test -n "$DEPLOY_PORT" || exit 1
          test -n "$DEPLOY_USER" || exit 1

          echo "All deployment variables are present"
          echo "Host is IPv4: $( [[ "$DEPLOY_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] && echo yes || echo no )"
          echo "Port is numeric: $( [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && echo yes || echo no )"

      - name: Diagnose SSH connectivity
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          echo "Checking SSH port..."
          if timeout 10 bash -c 'echo > /dev/tcp/$DEPLOY_HOST/$DEPLOY_PORT'; then
            echo "SSH PORT OPEN"
          else
            echo "SSH PORT UNREACHABLE"
          fi

          echo "Checking SSH banner..."
          ssh-keyscan -T 5 -p "$DEPLOY_PORT" "$DEPLOY_HOST" 2>&1 || true

      - name: Upload website
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -P "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            index.html projects.json \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/mrezvov.sknt.ru/html/"
